<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="5"/>
  
  <!-- Grid lines -->
  <g stroke="#f0f0f0" stroke-width="0.5">
    <!-- Horizontal grid lines -->
    <line x1="30" y1="40" x2="170" y2="40"/>
    <line x1="30" y1="70" x2="170" y2="70"/>
    <line x1="30" y1="100" x2="170" y2="100"/>
    <line x1="30" y1="130" x2="170" y2="130"/>
    <line x1="30" y1="160" x2="170" y2="160"/>
  </g>
  
  <!-- Axes -->
  <line x1="30" y1="170" x2="170" y2="170" stroke="#2c3e50" stroke-width="2"/>
  <line x1="30" y1="30" x2="30" y2="170" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Historical bars (solid) -->
  <g fill="#3498db" stroke="#2980b9" stroke-width="1">
    <rect x="40" y="130" width="20" height="40"/>
    <rect x="65" y="110" width="20" height="60"/>
    <rect x="90" y="90" width="20" height="80"/>
  </g>
  
  <!-- Dividing line between historical and predicted -->
  <line x1="115" y1="30" x2="115" y2="170" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  
  <!-- Predicted bars (gradient/pattern) -->
  <defs>
    <!-- Gradient for predicted bars -->
    <linearGradient id="predGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.4"/>
    </linearGradient>
    
    <!-- Pattern for predicted bars -->
    <pattern id="predPattern" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#e74c3c" opacity="0.3"/>
      <path d="M 0,4 l 4,-4 M -1,1 l 2,-2 M 3,5 l 2,-2" stroke="#e74c3c" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Predicted bars with pattern -->
  <g>
    <rect x="120" y="75" width="20" height="95" fill="url(#predPattern)" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,2"/>
    <rect x="145" y="60" width="20" height="110" fill="url(#predPattern)" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,2"/>
  </g>
  
  <!-- Confidence intervals (error bars) -->
  <g stroke="#c0392b" stroke-width="1.5">
    <!-- Bar 1 confidence interval -->
    <line x1="130" y1="65" x2="130" y2="85"/>
    <line x1="125" y1="65" x2="135" y2="65"/>
    <line x1="125" y1="85" x2="135" y2="85"/>
    
    <!-- Bar 2 confidence interval -->
    <line x1="155" y1="48" x2="155" y2="72"/>
    <line x1="150" y1="48" x2="160" y2="48"/>
    <line x1="150" y1="72" x2="160" y2="72"/>
  </g>
  
  <!-- Value labels on bars -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="middle">
    <text x="50" y="125">42</text>
    <text x="75" y="105">58</text>
    <text x="100" y="85">76</text>
    <text x="130" y="70" fill="#e74c3c" font-weight="bold">89*</text>
    <text x="155" y="55" fill="#e74c3c" font-weight="bold">102*</text>
  </g>
  
  <!-- X-axis labels -->
  <g font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d" text-anchor="middle">
    <text x="50" y="182">Q1</text>
    <text x="75" y="182">Q2</text>
    <text x="100" y="182">Q3</text>
    <text x="130" y="182">Q4</text>
    <text x="155" y="182">Q5</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(35, 15)">
    <!-- Actual -->
    <rect x="0" y="0" width="12" height="10" fill="#3498db"/>
    <text x="15" y="8" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Actual</text>
    
    <!-- Predicted -->
    <rect x="55" y="0" width="12" height="10" fill="url(#predPattern)" stroke="#e74c3c" stroke-width="1" stroke-dasharray="2,1"/>
    <text x="70" y="8" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Predicted</text>
  </g>
  
  <!-- Y-axis label -->
  <text x="15" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" transform="rotate(-90, 15, 100)">Values</text>
  
  <!-- Trend arrow overlay -->
  <defs>
    <marker id="trend-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#27ae60" opacity="0.8"/>
    </marker>
  </defs>
  <path d="M 50,150 Q 75,130 100,110 Q 125,95 145,85" 
        stroke="#27ae60" stroke-width="2" fill="none" 
        marker-end="url(#trend-arrow)" opacity="0.6" stroke-dasharray="4,2"/>
  
  <!-- Prediction confidence badge -->
  <g transform="translate(140, 145)">
    <rect x="-20" y="-8" width="40" height="16" fill="#9b59b6" rx="8" opacity="0.9"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">CI: 95%</text>
  </g>
  
  <!-- Small prediction indicator -->
  <g transform="translate(165, 35)">
    <circle r="12" fill="#e74c3c" opacity="0.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">+2</text>
  </g>
</svg>