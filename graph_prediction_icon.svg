<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Graph nodes and edges -->
  <!-- Main graph structure -->
  <g id="graph-network">
    <!-- Edges/connections -->
    <line x1="50" y1="50" x2="90" y2="70" stroke="#95a5a6" stroke-width="2"/>
    <line x1="50" y1="50" x2="70" y2="90" stroke="#95a5a6" stroke-width="2"/>
    <line x1="90" y1="70" x2="70" y2="90" stroke="#95a5a6" stroke-width="2"/>
    <line x1="90" y1="70" x2="130" y2="60" stroke="#95a5a6" stroke-width="2"/>
    <line x1="70" y1="90" x2="100" y2="130" stroke="#95a5a6" stroke-width="2"/>
    <line x1="130" y1="60" x2="100" y2="130" stroke="#95a5a6" stroke-width="2"/>
    
    <!-- Historical nodes (solid) -->
    <circle cx="50" cy="50" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="90" cy="70" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="70" cy="90" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="130" cy="60" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="100" cy="130" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  </g>
  
  <!-- Prediction arrow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Prediction path -->
  <path d="M 100 130 Q 120 140, 140 140" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  
  <!-- Predicted nodes (dashed outline) -->
  <circle cx="140" cy="140" r="8" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="165" cy="130" r="8" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="155" cy="155" r="8" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,2"/>
  
  <!-- Predicted edges (lighter, dashed) -->
  <line x1="140" y1="140" x2="165" y2="130" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
  <line x1="140" y1="140" x2="155" y2="155" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
  <line x1="165" y1="130" x2="155" y2="155" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
  
  <!-- Analytics trend line overlay -->
  <path d="M 30 160 Q 60 150, 90 145 T 150 120" stroke="#27ae60" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Small data points along trend -->
  <circle cx="30" cy="160" r="3" fill="#27ae60"/>
  <circle cx="60" cy="150" r="3" fill="#27ae60"/>
  <circle cx="90" cy="145" r="3" fill="#27ae60"/>
  <circle cx="120" cy="135" r="3" fill="#27ae60"/>
  <circle cx="150" cy="120" r="3" fill="#27ae60"/>
  
  <!-- Prediction indicator symbols -->
  <!-- Small chart in corner -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="30" height="20" fill="white" stroke="#34495e" stroke-width="1" rx="2"/>
    <polyline points="5,15 10,10 15,12 20,5 25,8" stroke="#e67e22" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- AI/ML indicator -->
  <g transform="translate(160, 40)">
    <circle cx="0" cy="0" r="15" fill="#9b59b6" opacity="0.2"/>
    <circle cx="0" cy="0" r="10" fill="#9b59b6" opacity="0.3"/>
    <circle cx="0" cy="0" r="5" fill="#8e44ad"/>
  </g>
  
  <!-- Probability/confidence indicator -->
  <g transform="translate(140, 170)">
    <rect x="-20" y="-8" width="40" height="16" fill="white" stroke="#34495e" stroke-width="1" rx="8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">85%</text>
  </g>
</svg>