<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="10" y="10" width="180" height="180" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="5"/>
  
  <!-- Title area -->
  <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Graph Reasoning Results</text>
  
  <!-- Input Graph Section -->
  <g transform="translate(50, 60)">
    <!-- Input label -->
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Input Graph</text>
    
    <!-- Graph edges -->
    <line x1="0" y1="0" x2="20" y2="10" stroke="#bdc3c7" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="10" y2="20" stroke="#bdc3c7" stroke-width="1.5"/>
    <line x1="20" y1="10" x2="30" y2="5" stroke="#bdc3c7" stroke-width="1.5"/>
    <line x1="20" y1="10" x2="25" y2="25" stroke="#bdc3c7" stroke-width="1.5"/>
    <line x1="10" y1="20" x2="25" y2="25" stroke="#bdc3c7" stroke-width="1.5"/>
    <line x1="30" y1="5" x2="35" y2="20" stroke="#bdc3c7" stroke-width="1.5"/>
    <line x1="25" y1="25" x2="35" y2="20" stroke="#bdc3c7" stroke-width="1.5"/>
    
    <!-- Graph nodes -->
    <circle cx="0" cy="0" r="4" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <circle cx="20" cy="10" r="4" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <circle cx="10" cy="20" r="4" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <circle cx="30" cy="5" r="4" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <circle cx="25" cy="25" r="4" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <circle cx="35" cy="20" r="4" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  </g>
  
  <!-- Reasoning Process Arrow -->
  <defs>
    <marker id="process-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
  </defs>
  <path d="M 95,70 L 115,70" stroke="#34495e" stroke-width="2" marker-end="url(#process-arrow)"/>
  
  <!-- Reasoning Process Visualization -->
  <g transform="translate(130, 70)">
    <!-- Neural network layers representation -->
    <circle cx="0" cy="-10" r="3" fill="#9b59b6" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#9b59b6" opacity="0.8"/>
    <circle cx="0" cy="10" r="3" fill="#9b59b6" opacity="0.8"/>
    
    <circle cx="15" cy="-8" r="3" fill="#8e44ad" opacity="0.8"/>
    <circle cx="15" cy="8" r="3" fill="#8e44ad" opacity="0.8"/>
    
    <circle cx="30" cy="0" r="3" fill="#9b59b6" opacity="0.8"/>
    
    <!-- Connections -->
    <line x1="3" y1="-10" x2="12" y2="-8" stroke="#9b59b6" stroke-width="0.5" opacity="0.5"/>
    <line x1="3" y1="0" x2="12" y2="-8" stroke="#9b59b6" stroke-width="0.5" opacity="0.5"/>
    <line x1="3" y1="10" x2="12" y2="8" stroke="#9b59b6" stroke-width="0.5" opacity="0.5"/>
    <line x1="3" y1="0" x2="12" y2="8" stroke="#9b59b6" stroke-width="0.5" opacity="0.5"/>
    <line x1="18" y1="-8" x2="27" y2="0" stroke="#9b59b6" stroke-width="0.5" opacity="0.5"/>
    <line x1="18" y1="8" x2="27" y2="0" stroke="#9b59b6" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Processing label -->
    <text x="15" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">GNN</text>
  </g>
  
  <!-- Results Section -->
  <g transform="translate(30, 120)">
    <!-- Community Detection Result -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Community Detection:</text>
      <!-- Mini graph with colored communities -->
      <g transform="translate(0, 10)">
        <!-- Community 1 (orange) -->
        <circle cx="5" cy="5" r="3" fill="#e67e22"/>
        <circle cx="15" cy="8" r="3" fill="#e67e22"/>
        <circle cx="10" cy="15" r="3" fill="#e67e22"/>
        <line x1="5" y1="5" x2="15" y2="8" stroke="#e67e22" stroke-width="1" opacity="0.5"/>
        <line x1="5" y1="5" x2="10" y2="15" stroke="#e67e22" stroke-width="1" opacity="0.5"/>
        <line x1="15" y1="8" x2="10" y2="15" stroke="#e67e22" stroke-width="1" opacity="0.5"/>
        
        <!-- Community 2 (green) -->
        <circle cx="25" cy="5" r="3" fill="#27ae60"/>
        <circle cx="35" cy="8" r="3" fill="#27ae60"/>
        <circle cx="30" cy="15" r="3" fill="#27ae60"/>
        <line x1="25" y1="5" x2="35" y2="8" stroke="#27ae60" stroke-width="1" opacity="0.5"/>
        <line x1="25" y1="5" x2="30" y2="15" stroke="#27ae60" stroke-width="1" opacity="0.5"/>
        <line x1="35" y1="8" x2="30" y2="15" stroke="#27ae60" stroke-width="1" opacity="0.5"/>
      </g>
    </g>
    
    <!-- Node Classification Result -->
    <g transform="translate(0, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Node Classification:</text>
      <g transform="translate(0, 10)">
        <!-- Bar chart showing classification probabilities -->
        <rect x="0" y="0" width="60" height="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.5"/>
        <rect x="0" y="0" width="45" height="8" fill="#3498db"/>
        <text x="65" y="6" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Class A: 75%</text>
        
        <rect x="0" y="10" width="60" height="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.5"/>
        <rect x="0" y="10" width="15" height="8" fill="#e74c3c"/>
        <text x="65" y="16" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Class B: 25%</text>
      </g>
    </g>
  </g>
  
  <!-- Key Insights Panel -->
  <g transform="translate(115, 120)">
    <rect x="0" y="0" width="70" height="60" fill="#f8f9fa" stroke="#dfe6e9" stroke-width="1" rx="3"/>
    <text x="35" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2c3e50">Key Insights</text>
    
    <!-- Insight items -->
    <g transform="translate(5, 20)">
      <circle cx="3" cy="3" r="2" fill="#27ae60"/>
      <text x="8" y="5" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2 communities</text>
    </g>
    <g transform="translate(5, 32)">
      <circle cx="3" cy="3" r="2" fill="#3498db"/>
      <text x="8" y="5" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">High centrality: N3</text>
    </g>
    <g transform="translate(5, 44)">
      <circle cx="3" cy="3" r="2" fill="#e74c3c"/>
      <text x="8" y="5" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Bridge nodes: 2</text>
    </g>
  </g>
  
  <!-- Accuracy/Performance Indicator -->
  <g transform="translate(150, 35)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ecf0f1" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#27ae60" stroke-width="3" 
            stroke-dasharray="94.2 18.8" stroke-dashoffset="23.5" transform="rotate(-90)"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">92%</text>
  </g>
</svg>