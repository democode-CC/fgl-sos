<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="5" y="5" width="190" height="190" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="5"/>
  
  <!-- Loop/Cycle Path -->
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Main cycle loop -->
  <path d="M 60,100 A 40,40 0 0,1 140,100" stroke="#3498db" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 140,100 A 40,40 0 0,1 60,100" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  
  <!-- Human Figure (left side) -->
  <g transform="translate(60, 100)">
    <!-- Head -->
    <circle cx="0" cy="-25" r="10" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <!-- Body -->
    <path d="M 0,-15 L 0,5 M -10,-5 L 10,-5 M 0,5 L -8,20 M 0,5 L 8,20" 
          stroke="#e67e22" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Hand pointing/interacting -->
    <circle cx="12" cy="-5" r="3" fill="#e67e22"/>
    <line x1="10" y1="-5" x2="20" y2="-5" stroke="#e67e22" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- AI/System (right side) -->
  <g transform="translate(140, 100)">
    <!-- Monitor/System -->
    <rect x="-15" y="-20" width="30" height="20" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="2"/>
    <rect x="-10" y="-15" width="20" height="10" fill="#ecf0f1"/>
    <!-- Base -->
    <rect x="-5" y="0" width="10" height="5" fill="#7f8c8d"/>
    <rect x="-8" y="5" width="16" height="3" fill="#7f8c8d" rx="1"/>
    <!-- Code lines on screen -->
    <line x1="-8" y1="-13" x2="-2" y2="-13" stroke="#3498db" stroke-width="1"/>
    <line x1="-8" y1="-10" x2="0" y2="-10" stroke="#2ecc71" stroke-width="1"/>
    <line x1="-8" y1="-7" x2="-3" y2="-7" stroke="#e74c3c" stroke-width="1"/>
  </g>
  
  <!-- Update/Feedback Icons along the loop -->
  <!-- Top arc - Human to System -->
  <g transform="translate(100, 60)">
    <circle r="15" fill="#3498db" opacity="0.2"/>
    <circle r="10" fill="white" stroke="#3498db" stroke-width="2"/>
    <!-- Checkmark -->
    <path d="M -4,0 L -1,3 L 4,-3" stroke="#3498db" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Bottom arc - System to Human -->
  <g transform="translate(100, 140)">
    <circle r="15" fill="#27ae60" opacity="0.2"/>
    <circle r="10" fill="white" stroke="#27ae60" stroke-width="2"/>
    <!-- Question mark -->
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">?</text>
  </g>
  
  <!-- Update indicators -->
  <!-- Human input indicator -->
  <g transform="translate(70, 70)">
    <rect x="-20" y="-8" width="40" height="16" fill="#e74c3c" rx="8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">Validate</text>
  </g>
  
  <!-- System update indicator -->
  <g transform="translate(130, 130)">
    <rect x="-20" y="-8" width="40" height="16" fill="#27ae60" rx="8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">Learn</text>
  </g>
  
  <!-- Central update symbol -->
  <g transform="translate(100, 100)">
    <circle r="20" fill="white" stroke="#34495e" stroke-width="2"/>
    <path d="M -8,-8 A 11,11 0 1,1 8,-8 L 8,-5 L 12,-8 L 8,-11 L 8,-8" 
          fill="none" stroke="#34495e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8,8 A 11,11 0 1,1 -8,8 L -8,5 L -12,8 L -8,11 L -8,8" 
          fill="none" stroke="#34495e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Update count badge -->
  <g transform="translate(170, 30)">
    <circle r="15" fill="#e74c3c"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">3</text>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Updates</text>
  </g>
</svg>