<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Knowledge Graph (protected) -->
  <g transform="translate(120, 100)">
    <!-- KG edges -->
    <line x1="0" y1="0" x2="-20" y2="-20" stroke="#6c757d" stroke-width="2"/>
    <line x1="0" y1="0" x2="20" y2="-20" stroke="#6c757d" stroke-width="2"/>
    <line x1="0" y1="0" x2="-20" y2="20" stroke="#6c757d" stroke-width="2"/>
    <line x1="0" y1="0" x2="20" y2="20" stroke="#6c757d" stroke-width="2"/>
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#6c757d" stroke-width="2"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#6c757d" stroke-width="2"/>
    
    <!-- KG nodes -->
    <circle cx="0" cy="0" r="8" fill="#0d6efd" stroke="#0a58ca" stroke-width="2"/>
    <circle cx="-20" cy="-20" r="6" fill="#6610f2" stroke="#520dc3" stroke-width="2"/>
    <circle cx="20" cy="-20" r="6" fill="#6610f2" stroke="#520dc3" stroke-width="2"/>
    <circle cx="-20" cy="20" r="6" fill="#6610f2" stroke="#520dc3" stroke-width="2"/>
    <circle cx="20" cy="20" r="6" fill="#6610f2" stroke="#520dc3" stroke-width="2"/>
  </g>
  
  <!-- Shield protecting the KG -->
  <g transform="translate(120, 100)">
    <path d="M 0,-35 L -30,-20 L -30,15 Q -30,35 0,45 Q 30,35 30,15 L 30,-20 Z" 
          fill="#28a745" fill-opacity="0.3" stroke="#28a745" stroke-width="3"/>
    <!-- Shield checkmark -->
    <path d="M -10,0 L -3,7 L 10,-7" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -10,0 L -3,7 L 10,-7" stroke="#28a745" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Attacker/Hacker -->
  <g transform="translate(50, 100)">
    <!-- Hacker figure -->
    <circle cx="0" cy="-10" r="10" fill="#2c3e50" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Hood -->
    <path d="M -10,-10 Q 0,-20 10,-10 L 10,-5 Q 0,-15 -10,-5 Z" fill="#1a1a1a"/>
    <!-- Evil eyes -->
    <circle cx="-3" cy="-10" r="1.5" fill="#e74c3c"/>
    <circle cx="3" cy="-10" r="1.5" fill="#e74c3c"/>
    <!-- Body -->
    <rect x="-8" y="0" width="16" height="20" fill="#2c3e50" rx="3"/>
  </g>
  
  <!-- Attack attempt (blocked) -->
  <g>
    <!-- Attack line -->
    <line x1="60" y1="100" x2="85" y2="100" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
    <!-- Blocked symbol -->
    <g transform="translate(85, 100)">
      <circle r="8" fill="#dc3545" stroke="#c82333" stroke-width="2"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="white" stroke-width="3" transform="rotate(45)"/>
    </g>
  </g>
</svg>