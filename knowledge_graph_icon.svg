<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Knowledge Graph Edges -->
  <g stroke="#6c757d" stroke-width="2" fill="none">
    <!-- Central connections -->
    <line x1="100" y1="50" x2="100" y2="100"/>
    <line x1="100" y1="100" x2="100" y2="150"/>
    <line x1="100" y1="100" x2="50" y2="100"/>
    <line x1="100" y1="100" x2="150" y2="100"/>
    
    <!-- Diagonal connections -->
    <line x1="100" y1="100" x2="65" y2="65"/>
    <line x1="100" y1="100" x2="135" y2="65"/>
    <line x1="100" y1="100" x2="65" y2="135"/>
    <line x1="100" y1="100" x2="135" y2="135"/>
    
    <!-- Outer connections -->
    <line x1="100" y1="50" x2="65" y2="65"/>
    <line x1="100" y1="50" x2="135" y2="65"/>
    <line x1="50" y1="100" x2="65" y2="65"/>
    <line x1="50" y1="100" x2="65" y2="135"/>
    <line x1="150" y1="100" x2="135" y2="65"/>
    <line x1="150" y1="100" x2="135" y2="135"/>
    <line x1="100" y1="150" x2="65" y2="135"/>
    <line x1="100" y1="150" x2="135" y2="135"/>
    
    <!-- Cross connections -->
    <line x1="65" y1="65" x2="135" y2="65"/>
    <line x1="65" y1="135" x2="135" y2="135"/>
  </g>
  
  <!-- Knowledge Graph Nodes -->
  <!-- Central node (larger, different color) -->
  <circle cx="100" cy="100" r="12" fill="#0d6efd" stroke="#0a58ca" stroke-width="2"/>
  
  <!-- Primary nodes (medium size) -->
  <circle cx="100" cy="50" r="10" fill="#6610f2" stroke="#520dc3" stroke-width="2"/>
  <circle cx="100" cy="150" r="10" fill="#6610f2" stroke="#520dc3" stroke-width="2"/>
  <circle cx="50" cy="100" r="10" fill="#6610f2" stroke="#520dc3" stroke-width="2"/>
  <circle cx="150" cy="100" r="10" fill="#6610f2" stroke="#520dc3" stroke-width="2"/>
  
  <!-- Secondary nodes (smaller) -->
  <circle cx="65" cy="65" r="8" fill="#20c997" stroke="#1aa179" stroke-width="2"/>
  <circle cx="135" cy="65" r="8" fill="#20c997" stroke="#1aa179" stroke-width="2"/>
  <circle cx="65" cy="135" r="8" fill="#20c997" stroke="#1aa179" stroke-width="2"/>
  <circle cx="135" cy="135" r="8" fill="#20c997" stroke="#1aa179" stroke-width="2"/>
</svg>