<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="5" y="5" width="190" height="190" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="5"/>
  
  <!-- Query Input (top) -->
  <g transform="translate(100, 30)">
    <rect x="-30" y="-10" width="60" height="20" fill="#3498db" rx="10"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Query</text>
  </g>
  
  <!-- Arrow down -->
  <defs>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#34495e"/>
    </marker>
  </defs>
  <line x1="100" y1="45" x2="100" y2="65" stroke="#34495e" stroke-width="2" marker-end="url(#arrow-down)"/>
  
  <!-- Retrieval Component (left) -->
  <g transform="translate(50, 90)">
    <!-- Database/Knowledge Base -->
    <ellipse cx="0" cy="-5" rx="20" ry="6" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="-20" y="-5" width="40" height="20" fill="#e74c3c"/>
    <ellipse cx="0" cy="15" rx="20" ry="6" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <!-- Database lines -->
    <line x1="-15" y1="0" x2="-15" y2="10" stroke="#c0392b" stroke-width="1"/>
    <line x1="-5" y1="0" x2="-5" y2="10" stroke="#c0392b" stroke-width="1"/>
    <line x1="5" y1="0" x2="5" y2="10" stroke="#c0392b" stroke-width="1"/>
    <line x1="15" y1="0" x2="15" y2="10" stroke="#c0392b" stroke-width="1"/>
    
    <!-- Retrieval label -->
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#c0392b">Knowledge</text>
  </g>
  
  <!-- Search/Retrieval arrows -->
  <g>
    <!-- Search beam effect -->
    <path d="M 75,85 L 90,80 L 90,100 Z" fill="#f39c12" opacity="0.3"/>
    <line x1="75" y1="90" x2="90" y2="90" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow-down)"/>
  </g>
  
  <!-- Central Processing (Augmentation) -->
  <g transform="translate(100, 90)">
    <circle r="25" fill="#9b59b6" opacity="0.2"/>
    <circle r="20" fill="#9b59b6" opacity="0.3"/>
    <circle r="15" fill="#8e44ad"/>
    <!-- Merge symbol -->
    <path d="M -8,-5 L 0,0 L -8,5 M 8,-5 L 0,0 L 8,5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Augment label -->
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad">Augment</text>
  </g>
  
  <!-- Generation Component (right) -->
  <g transform="translate(150, 90)">
    <!-- AI Brain/Model -->
    <circle cx="0" cy="0" r="20" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <!-- Brain pattern -->
    <path d="M -10,0 Q -5,-8 0,-5 Q 5,-8 10,0 Q 5,8 0,5 Q -5,8 -10,0" 
          fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    
    <!-- Generate label -->
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">Generate</text>
  </g>
  
  <!-- Flow arrows -->
  <line x1="125" y1="90" x2="130" y2="90" stroke="#34495e" stroke-width="2"/>
  
  <!-- Output Response (bottom) -->
  <g transform="translate(100, 140)">
    <line x1="0" y1="-15" x2="0" y2="-5" stroke="#34495e" stroke-width="2" marker-end="url(#arrow-down)"/>
    <rect x="-40" y="0" width="80" height="30" fill="#2ecc71" rx="5"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Enhanced</text>
    <text x="0" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Response</text>
  </g>
  
  <!-- RAG label -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">RAG</text>
</svg>