<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Simple vector representation -->
  <g transform="translate(100, 100)">
    <!-- Left bracket -->
    <path d="M -25,-50 L -30,-50 L -30,50 L -25,50" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Right bracket -->
    <path d="M 25,-50 L 30,-50 L 30,50 L 25,50" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Vector values -->
    <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3498db" font-weight="bold">0.42</text>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3498db" font-weight="bold">-0.15</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3498db" font-weight="bold">0.73</text>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3498db" font-weight="bold">0.28</text>
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3498db" font-weight="bold">-0.91</text>
  </g>
</svg>