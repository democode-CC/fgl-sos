<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="5" y="5" width="190" height="190" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="5"/>
  
  <!-- Input side (left) - Text/Data -->
  <g transform="translate(40, 100)">
    <!-- Text document icon -->
    <rect x="-20" y="-30" width="40" height="50" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="2"/>
    <!-- Text lines -->
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#2c3e50" stroke-width="2"/>
    <line x1="-15" y1="-10" x2="10" y2="-10" stroke="#2c3e50" stroke-width="2"/>
    <line x1="-15" y1="0" x2="12" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <line x1="-15" y1="10" x2="8" y2="10" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Sample text below -->
    <text x="0" y="35" text-anchor="middle" font-family="monospace" font-size="10" fill="#7f8c8d">"Hello World"</text>
  </g>
  
  <!-- Transformation Arrow -->
  <defs>
    <marker id="transform-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- Arrow with transformation effect -->
  <g>
    <path d="M 65,100 L 90,100" stroke="#3498db" stroke-width="3" marker-end="url(#transform-arrow)"/>
    <!-- Transformation particles -->
    <circle cx="70" cy="95" r="2" fill="#3498db" opacity="0.6"/>
    <circle cx="75" cy="105" r="2" fill="#3498db" opacity="0.7"/>
    <circle cx="80" cy="98" r="2" fill="#3498db" opacity="0.8"/>
    <circle cx="85" cy="102" r="2" fill="#3498db" opacity="0.9"/>
  </g>
  
  <!-- Processing/Transformation Center -->
  <g transform="translate(100, 100)">
    <circle r="20" fill="#9b59b6" opacity="0.2"/>
    <circle r="15" fill="#9b59b6" opacity="0.3"/>
    <circle r="10" fill="#8e44ad"/>
    <!-- Neural network symbol -->
    <circle cx="-3" cy="-3" r="2" fill="white"/>
    <circle cx="3" cy="-3" r="2" fill="white"/>
    <circle cx="0" cy="3" r="2" fill="white"/>
    <line x1="-3" y1="-3" x2="0" y2="3" stroke="white" stroke-width="0.5"/>
    <line x1="3" y1="-3" x2="0" y2="3" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- Output side (right) - Vector -->
  <g transform="translate(140, 100)">
    <!-- Vector representation -->
    <rect x="-5" y="-40" width="35" height="80" fill="#e8f5e9" stroke="#27ae60" stroke-width="2" rx="2"/>
    
    <!-- Vector values -->
    <text x="12" y="-30" text-anchor="middle" font-family="monospace" font-size="9" fill="#27ae60" font-weight="bold">[</text>
    <text x="12" y="-20" text-anchor="middle" font-family="monospace" font-size="8" fill="#2c3e50">0.42</text>
    <text x="12" y="-10" text-anchor="middle" font-family="monospace" font-size="8" fill="#2c3e50">-0.15</text>
    <text x="12" y="0" text-anchor="middle" font-family="monospace" font-size="8" fill="#2c3e50">0.73</text>
    <text x="12" y="10" text-anchor="middle" font-family="monospace" font-size="8" fill="#2c3e50">0.28</text>
    <text x="12" y="20" text-anchor="middle" font-family="monospace" font-size="8" fill="#2c3e50">-0.91</text>
    <text x="12" y="30" text-anchor="middle" font-family="monospace" font-size="8" fill="#2c3e50">...</text>
    <text x="12" y="38" text-anchor="middle" font-family="monospace" font-size="9" fill="#27ae60" font-weight="bold">]</text>
    
    <!-- Dimension indicator -->
    <text x="12" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">d=768</text>
  </g>
  
  <!-- Visual representation of vector space -->
  <g transform="translate(140, 35)">
    <!-- 3D axes -->
    <line x1="0" y1="0" x2="20" y2="0" stroke="#e74c3c" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="-10" y2="10" stroke="#27ae60" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Vector arrow in 3D space -->
    <line x1="0" y1="0" x2="12" y2="8" stroke="#f39c12" stroke-width="2" marker-end="url(#transform-arrow)"/>
    <circle cx="0" cy="0" r="2" fill="#34495e"/>
  </g>
  
  <!-- Labels -->
  <text x="40" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Text/Data</text>
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Embedding</text>
  <text x="155" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Vector</text>
  
  <!-- Mathematical notation -->
  <g transform="translate(100, 30)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      f: X → ℝ<tspan baseline-shift="super" font-size="8">n</tspan>
    </text>
  </g>
</svg>